<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Weathery - accurate weather forecast for your city. Real-time temperature, precipitation, wind and weather data."
        />

        <link rel="preload" href="/logo.png" as="image" fetchpriority="high" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicon/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon/favicon-16x16.png"
        />
        <link
            rel="preload"
            href="/fonts/Quicksand-Regular.woff2"
            as="font"
            type="font/woff2"
            crossorigin
            fetchpriority="high"
        />
        <link
            rel="preload"
            href="/fonts/Quicksand-Bold.woff2"
            as="font"
            type="font/woff2"
            crossorigin
            fetchpriority="high"
        />
        <link rel="manifest" href="/site.webmanifest" />
        <link
            rel="preload"
            href="/assets/weatherImages/sunny.webp"
            as="image"
            fetchpriority="high"
        />
        <link
            rel="preload"
            href="/assets/weatherImages/cloud-sunny.webp"
            as="image"
        />
        <link
            rel="preload"
            href="/assets/weatherImages/cloudy.webp"
            as="image"
        />
        <link
            rel="preload"
            href="/assets/weatherImages/misty.webp"
            as="image"
        />
        <link
            rel="preload"
            href="/assets/weatherImages/rainy.webp"
            as="image"
        />
        <link
            rel="preload"
            href="/assets/weatherImages/snowy.webp"
            as="image"
        />
        <link
            rel="preload"
            href="/assets/weatherImages/stormy.webp"
            as="image"
        />
        <link
            rel="preload"
            href="/assets/weatherImages/night.webp"
            as="image"
        />

        <title>Weathery</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
